# Test profile: in-memory H2 database in MySQL mode, ML module unreachable (fallback paths exercised)
spring.datasource.url=jdbc:h2:mem:fmls_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
app.seed-enabled=false
app.simulate-market-feed=false
app.ml-service-url=http://localhost:1
app.ml-timeout-seconds=2
app.jwt-secret=test-secret-test-secret-test-secret-123456
app.auto-approve-farmers=false
