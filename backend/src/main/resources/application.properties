# =====================================================================================
# Farmer Market Linkage System – backend configuration
# =====================================================================================
server.port=8080
spring.application.name=fmls-backend

# ---- Database Management Module: MySQL (XAMPP default: user root, empty password) ----
# The database "fmls_db" is created automatically on first start.
spring.datasource.url=jdbc:mysql://localhost:3306/fmls_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Nairobi&rewriteBatchedStatements=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Application settings ----
# Python ML module (price prediction, demand forecasting, recommendations)
app.ml-service-url=http://localhost:8000
app.ml-timeout-seconds=20
app.ml-train-timeout-seconds=600
# Secret used to sign login tokens – change it in production
app.jwt-secret=fmls-strathmore-164430-change-this-secret-in-production-2026
app.jwt-expiry-hours=12
# Load the simulated Kenyan dataset + demo accounts when the database is empty
app.seed-enabled=true
# New farmer accounts need administrator approval (set true to auto-approve)
app.auto-approve-farmers=false
# Simulated real-time market feed (adds prices every Tuesday/Friday market day)
app.simulate-market-feed=true
# Retrain the ML models from the database on every start (they are also retrained weekly)
app.train-on-startup=false
# Angular dev server
app.cors-origins=http://localhost:4200,http://127.0.0.1:4200

logging.level.ke.ac.strathmore.fmls=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
